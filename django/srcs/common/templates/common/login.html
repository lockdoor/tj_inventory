{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TJ Inventory System</title>
    <link rel="stylesheet" href="{% static 'common/css/index.css' %}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.15) 0px, transparent 50%);
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
            animation: fadeIn 0.8s ease-out;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 2rem;
            padding: 3rem;
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 2rem;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), transparent 50%);
            pointer-events: none;
        }

        .brand-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .logo-icon svg {
            color: white;
            width: 32px;
            height: 32px;
        }

        .welcome-text h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: white;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .welcome-text p {
            color: var(--text-dim);
            font-size: 0.9375rem;
        }

        .form-field {
            margin-bottom: 1.75rem;
        }

        .form-field label {
            color: var(--text-dim);
            font-size: 0.8125rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.625rem;
        }

        .form-field input {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            height: 52px;
            padding: 0 1.25rem;
            border-radius: 1rem;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-field input:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        .login-btn {
            width: 100%;
            height: 52px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 1rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 8px 16px -4px rgba(16, 185, 129, 0.4);
        }

        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -4px rgba(16, 185, 129, 0.5);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Subtle animated background elements */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: -1;
            animation: pulse 10s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-10%, -10%) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-section">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                </div>
                <div class="welcome-text">
                    <h1>TJ Global</h1>
                    <p>Inventory Control Portal</p>
                </div>
            </div>

            <form method="post">
                {% csrf_token %}
                
                {% if form.errors %}
                <div class="error-msg">
                    Invalid username or password.
                </div>
                {% endif %}

                <div class="form-field">
                    <label for="{{ form.username.id_for_label }}">Account ID</label>
                    <input type="text" name="username" id="{{ form.username.id_for_label }}" placeholder="Enter your username" required autofocus>
                </div>

                <div class="form-field">
                    <label for="{{ form.password.id_for_label }}">Security Key</label>
                    <input type="password" name="password" id="{{ form.password.id_for_label }}" placeholder="••••••••" required>
                </div>

                <button type="submit" class="login-btn">
                    Authenticate
                </button>
            </form>
        </div>
        
        <p style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.75rem; letter-spacing: 0.025em;">
            &copy; 2026 TJ Inventory Engine. Unauthorized access is prohibited.
        </p>
    </div>
</body>
</html>
