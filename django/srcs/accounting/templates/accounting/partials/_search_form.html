<div class="glass-card" style="padding: 1.5rem; margin-bottom: 1.5rem; border-color: rgba(255,255,255,0.08);">
    <form method="get" id="advancedSearchForm" style="display: flex; flex-direction: column; gap: 1rem;">
        {% if selected_round_id %}
        <input type="hidden" name="round_id" value="{{ selected_round_id }}">
        {% endif %}
        
        <!-- Search Conditions Container -->
        <div id="searchConditionsContainer" style="display: flex; flex-direction: column; gap: 0.75rem;">
            {% for line in search_lines %}
            <div class="search-condition-row" style="display: flex; gap: 0.75rem; align-items: center;">
                <!-- Field Dropdown -->
                <select name="sf" class="form-input" style="width: 220px; padding: 0.6rem;">
                    <option value="all" {% if line.field == 'all' %}selected{% endif %}>All Fields</option>
                    <option value="voucher_no" {% if line.field == 'voucher_no' %}selected{% endif %}>Voucher No</option>
                    <option value="payee" {% if line.field == 'payee' %}selected{% endif %}>Payee</option>
                    <option value="gl_code" {% if line.field == 'gl_code' %}selected{% endif %}>GL Code</option>
                    <option value="external_pv" {% if line.field == 'external_pv' %}selected{% endif %}>External PV</option>
                    <option value="description" {% if line.field == 'description' %}selected{% endif %}>Description / Note</option>
                </select>

                <!-- Value Input -->
                <div style="flex-grow: 1; position: relative;">
                    <input type="text" name="sv" value="{{ line.value }}" placeholder="Search query..." class="form-input" style="width: 100%; padding-left: 2.75rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); opacity: 0.5;">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>

                <!-- Remove Button -->
                <button type="button" class="btn btn-outline remove-condition-btn" onclick="removeSearchConditionRow(this)" style="padding: 0.6rem; border-color: rgba(239, 68, 68, 0.2); color: #f87171;" title="Remove Condition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            {% endfor %}
        </div>

        <!-- Controls Footer -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem; margin-top: 0.5rem;">
            <!-- Add Condition Button -->
            <button type="button" class="btn btn-outline" onclick="addSearchConditionRow()" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.25rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Add Condition
            </button>

            <!-- Search / Reset Buttons -->
            <div style="display: flex; gap: 0.75rem;">
                <button type="submit" class="btn btn-primary" style="padding: 0.6rem 2rem; font-weight: 700;">Search</button>
                <a href="{% url 'accounting:payment-list' account.code %}" class="btn btn-outline" style="padding: 0.6rem 1.25rem; border-color: rgba(255,255,255,0.05);">Reset</a>
            </div>
        </div>
    </form>
</div>

<script>
function addSearchConditionRow() {
    const container = document.getElementById('searchConditionsContainer');
    const firstRow = container.querySelector('.search-condition-row');
    const newRow = firstRow.cloneNode(true);
    
    // Reset values in new row
    newRow.querySelector('select').selectedIndex = 0;
    newRow.querySelector('input').value = '';
    
    container.appendChild(newRow);
}

function removeSearchConditionRow(button) {
    const container = document.getElementById('searchConditionsContainer');
    const rows = container.querySelectorAll('.search-condition-row');
    if (rows.length > 1) {
        button.closest('.search-condition-row').remove();
    } else {
        // Just clear the single remaining row
        rows[0].querySelector('select').selectedIndex = 0;
        rows[0].querySelector('input').value = '';
    }
}
</script>
